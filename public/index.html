<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RajShop2 - Checkout</title>
  <style>
    body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background: #f4f4f9; }
    .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; max-width: 400px; width: 100%; }
    .btn { background: #009ee3; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 5px; cursor: pointer; transition: 0.2s; }
    .btn:hover { background: #0081b8; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Produto RajShop</h2>
    <p>Valor: <strong>R$ 10,00</strong></p>
    <button class="btn" id="pay-btn">Comprar com Mercado Pago</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
